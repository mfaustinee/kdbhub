
<!DOCTYPE html>

  <title>KDB Hub</title>
  <meta name="description" content="">
  <meta property="og:title" content="KDB Hub">
  <meta property="og:description" content="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Restrict browser zooming across devices without changing input font sizes
    (function() {
      // Prevent Safari gesture zooming (pinch in/out)
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gestureend', function(e) {
        e.preventDefault();
      }, { passive: false });

      // Prevent multi-touch pinch zoom
      document.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent double-tap zoom
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // Re-enforce scale on editable space selection/focus
      var enforceScale = function() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover');
        }
      };

      document.addEventListener('focusin', function(e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || e.target.isContentEditable)) {
          enforceScale();
        }
      });
      document.addEventListener('focusout', enforceScale);
    })();
  </script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>
  <script>
    // Runtime environment variable injection
    (async () => {
      try {
        const response = await fetch('/api/config');
        if (response.ok) {
          window._env_ = await response.json();
          console.log("[Runtime] Environment variables loaded from server.");
        }
      } catch (e) {
        console.warn("[Runtime] Failed to load environment variables from server, falling back to build-time values.");
      }
    })();
  </script>
  <!-- Cache-busting comment: 2026-03-17-0556 -->
  <script type="module" src="/index.tsx"></script>
</body>
